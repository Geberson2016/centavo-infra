# Stack completo do Centavo para rodar local com um comando:
#   Postgres → API Spring (backend) → BFF (Fastify) → UI (nginx servindo o build do Vite)
# Os repositórios ficam lado a lado com este (../centavo-backend, ../centavo-bff,
# ../centavo-frontend) e cada um tem o seu Dockerfile. Os segredos vêm do .env (ver
# .env.example). As portas são publicadas só em 127.0.0.1.
name: centavo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - centavo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../centavo-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Sem actuator: a porta aberta indica que o Spring terminou de subir.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  bff:
    build: ../centavo-bff
    environment:
      BACKEND_URL: http://backend:8080
      SESSION_KEY: ${SESSION_KEY:?defina SESSION_KEY no .env}
      # O stack local é servido por http://localhost; cookie Secure exigiria HTTPS.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${BFF_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ../centavo-frontend
    environment:
      BFF_URL: http://bff:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:80"
    depends_on:
      bff:
        condition: service_healthy

volumes:
  # Mesmo nome (e projeto "centavo") do compose antigo: o banco de dev continua com os dados.
  centavo-pgdata:
